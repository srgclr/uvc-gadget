image boot.vfat {
    vfat {
        label = "boot"
        files = {
            "bcm2711-rpi-4-b.dtb",
            "overlays/dwc2.dtbo",
            "fixup4.dat",
            "start4.elf",
            "Image",
            "config.txt",
            "cmdline.txt",
        }
    }
    size = 64M
}

image sdcard.img {
    hdimage {}

    partition boot {
        partition-type = 0xC
        bootable = true
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
